[package]
name = "tender-verify-core"
version = "0.1.0"
edition = "2024"

# cdylib so it links as a WebAssembly module; rlib so native tests can use it.
[lib]
crate-type = ["cdylib", "rlib"]

# Deliberately no tonic, no rustls, no networking. This crate only decrypts
# bytes it is handed, which keeps it compilable to wasm32 and keeps the
# security-relevant code in one small, auditable place.
#
# Versions are pinned to what zcash_client_backend 0.24 resolves to; these
# crates share types across public APIs and a mismatched minor version produces
# trait errors that look unrelated to the real cause.
[dependencies]
zcash_client_backend = "0.24.0"
zcash_primitives = "0.30.1"
zcash_keys = "0.16.1"
zcash_protocol = "0.10.6"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
