[package]
name = "tender-verify"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Versions are pinned to the zcash_client_backend 0.25 pre-release train.
# These crates share types across their public APIs, so a mismatched minor
# version produces trait errors that look unrelated to the real cause.
# These are pre-release versions, deliberately.
#
# Zcash testnet has activated NU7, whose consensus branch id (0x77190ad9) is
# only recognised from zcash_protocol 0.11.0-pre.1 onwards. On the stable 0.10.x
# line every current testnet transaction fails to parse with "invalid consensus
# branch id", so stable crates cannot read the chain we are testing against.
#
# The four crates share types across their public APIs and must come from the
# same pre-release train, or you get trait errors that look unrelated to the
# real cause.
[dependencies]
zcash_client_backend = { version = "=0.25.0-pre.2", features = [
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
zcash_primitives = "=0.31.0-pre.2"
zcash_keys = "=0.17.0-pre.2"
zcash_protocol = "=0.11.0-pre.1"
# `tls-ring` picks rustls's crypto backend. Without an explicit provider,
# rustls 0.23 panics at the first TLS connection; `ring` is chosen over
# `aws-lc` because it needs no C toolchain.
tonic = { version = "0.14", features = [
    "tls-webpki-roots",
    "tls-ring",
    "transport",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
getrandom = "0.4"
zip32 = "0.3"
# Same major line zcash_keys uses, so a phrase generated here derives exactly
# the addresses that Zashi or Zingo derive when it is restored there.
bip0039 = "0.12"
hex = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sapling = { package = "sapling-crypto", version = "=0.9.0" }
orchard = "=0.16.0"
zcash_note_encryption = "=0.5.1"
ed25519-compact = { version = "=2.6.0", default-features = false, features = ["std"] }

# Compiling librustzcash unoptimised makes note decryption painfully slow,
# so keep a little optimisation even in debug builds.
[profile.dev]
opt-level = 1
